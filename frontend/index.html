<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <title>Snap Trace</title>
</head>
<body>
    <section>
        <h1>Welcome to Snap Trace</h1>
        <p>Your go-to URL shortening service with real-time analytics.</p>
        <form id="urlForm">
            <input type="url" id="longUrl" placeholder="Enter your long URL here" required>
            <input type="datetime-local" id="expiresAt" placeholder="Expiration time (optional)">
            <input type="submit" id="submit" value="Shorten URL">
        </form>
        <p id="error" style="display:none; color:red;"></p>
        <div id="result" style="display: none;">
            <textarea id="shortUrl" type="text" readonly></textarea> <button id="copy">Copy</button>
            <textarea id="stats" type="text" readonly></textarea>
        </div>
    </section>
</body>
</html>
