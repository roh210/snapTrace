<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapTrace — tiny links</title>
    <link rel="icon" type="image/png" href="./snapcat/wave/frame-1.png">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" defer src="app.js"></script>
</head>

<body>

    <!-- Boot screen — full-screen moment before main UI is visible -->
    <div id="cat-boot" aria-hidden="true">

        <!-- Hanger: string + sprite rotate together around top-center pivot -->
        <div class="cat-boot__hanger">
            <div class="cat-boot__string"></div>
            <img id="cat-boot__sprite" class="cat-boot__sprite"
                 src="snapcat/initial_loading/frame-1.png" alt="" draggable="false">
        </div>

        <!-- Progress section below the swinging cat -->
        <div class="cat-boot__progress-wrap">
            <div class="cat-boot__progress">
                <div class="cat-boot__progress-fill"></div>
            </div>
            <span class="cat-boot__label">Loading</span>
        </div>

    </div>

    <div class="phone-world">
        <div class="phone">

            <!-- Dynamic Island -->
            <div class="phone-notch">
                <div class="phone-notch__mic"></div>
                <div class="phone-notch__cam"></div>
            </div>

            <!-- Status Bar -->
            <div class="phone-status">
                <span>9:41</span>
                <div class="phone-status__icons">
                    <span>▲▲▲</span><span>WiFi</span><span>100%</span>
                </div>
            </div>

            <!-- Screen -->
            <div class="phone-screen">

                <!-- Hero -->
                <div class="hero">
                    <div class="logo">
                        <span class="logo__snap">snap</span><span class="logo__trace">trace</span>
                    </div>
                    <p class="hero__tagline"> 🐾 snap it. share it. track it. 🐾</p>
                </div>

                <!-- Form -->
                <form class="form-section" id="urlForm" novalidate>
                    <label class="field-label" for="longUrl">long url</label>
                    <input class="field-input" type="url" id="longUrl" placeholder="paste your long link here..."
                        autocomplete="off" spellcheck="false">

                    <label class="field-label" for="expiresAt">
                        expires at <span style="opacity:0.5;font-weight:400;font-size:9px;">(optional)</span>
                    </label>
                    <input class="field-input" type="datetime-local" id="expiresAt">

                    <button class="btn-shorten" type="submit" id="submit">
                        ✦ shorten url
                    </button>
                </form>

                <!-- Error -->
                <p id="error" role="alert"></p>

                <!-- Result -->
                <div class="result-wrap">
                    <div id="result">

                        <div class="result-card">
                            <div class="result-badge">✦ your snap link</div>
                            <input id="shortUrl" type="text" readonly aria-label="Shortened URL">
                            <div class="result-btns">
                                <button class="btn-copy" id="copy" type="button">📋 copy</button>
                                <button class="btn-stats" id="viewStats" type="button">📊 stats</button>
                            </div>
                            <div id="qrcode" class="qr-code"></div>
                        </div>

                        <div class="stats-card">
                            <div class="stats-badge">✦ link analytics</div>
                            <div id="stats"></div>
                        </div>

                    </div>
                </div>

            </div>

            <!-- Home Bar -->
            <div class="phone-home">
                <div class="phone-home__bar"></div>
            </div>

        </div>
    </div>
</body>

</html>
